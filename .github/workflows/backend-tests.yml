name: backend-tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sec001
          POSTGRES_PASSWORD: sec001
          POSTGRES_DB: sec001
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sec001 -d sec001"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full verification
        env:
          DOCS_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
          SEC001_TEST_DATABASE_URL: postgresql://sec001:sec001@localhost:5432/sec001
        run: python scripts/verify.py
